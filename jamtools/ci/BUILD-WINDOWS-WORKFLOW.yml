name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["jamtools-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: jamtools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q

      - name: Build EXE (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean
          --name JamTools --onefile --windowed
          --icon assets/icon.ico
          --add-data "assets;assets"
          --collect-all PySide6
          run.py

      - name: Smoke-test EXE
        run: |
          if (!(Test-Path dist\JamTools.exe)) { throw "EXE not found!" }
          (Get-Item dist\JamTools.exe).Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JamTools-windows
          path: jamtools/dist/JamTools.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: jamtools/dist/JamTools.exe
