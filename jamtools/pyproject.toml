[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jamtools"
version = "1.0.0"
description = "JamTools — All-in-One Windows file toolbox (PySide6 desktop app)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "PySide6>=6.7",
  "Pillow>=10.0",
]

[project.optional-dependencies]
full = [
  "PyMuPDF>=1.23",
  "pdf2docx>=0.5.6",
  "pytesseract>=0.3.10",
  "mutagen>=1.46",
]
dev = ["pytest>=8.0"]

[project.scripts]
jamtools = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
